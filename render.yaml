services:
  - type: web
    name: itemforge-ai
    runtime: python
    rootDir: services/ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: fixture

  - type: web
    name: itemforge-api
    runtime: node
    rootDir: .
    buildCommand: npm ci && npm run build --workspace @itemforge/api
    startCommand: npm run start --workspace @itemforge/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: API_PORT
        value: '4000'

  - type: web
    name: itemforge-web
    runtime: static
    rootDir: apps/web
    buildCommand: cd ../.. && npm ci && npm run build --workspace @itemforge/web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://itemforge-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
