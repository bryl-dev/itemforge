services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: itemforge
      POSTGRES_PASSWORD: itemforge
      POSTGRES_DB: itemforge
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U itemforge -d itemforge']
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./services/ai
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-fixture}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:8000/health'')"']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DB_DIALECT: postgres
      DATABASE_URL: postgres://itemforge:itemforge@db:5432/itemforge
      AI_ENGINE_URL: http://ai:8000
      WEB_ORIGIN: http://localhost:80
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '80:80'
    depends_on:
      - api

volumes:
  db-data:
